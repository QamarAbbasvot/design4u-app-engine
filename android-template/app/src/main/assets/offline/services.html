<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Services</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; line-height: 1.6; }
    h1 { font-size: 22px; color: #34d399; margin-bottom: 14px; }
    .grid { display: grid; gap: 12px; }
    .item { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 16px; }
    .item h2 { font-size: 16px; margin-bottom: 4px; color: #fff; }
    .item p { font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>
  <h1>Our Services</h1>
  <div class="grid">
    <div class="item">
      <h2>24/7 Digital Access</h2>
      <p>Browse our core catalog and essential guides even in low-connectivity areas.</p>
    </div>
    <div class="item">
      <h2>Instant Support</h2>
      <p>Reach our customer team via phone, email, or WhatsApp directly from the Contact tab.</p>
    </div>
    <div class="item">
      <h2>Secure Transactions</h2>
      <p>Encrypted HTTPS connections whenever you go online.</p>
    </div>
  </div>
</body>
</html>
