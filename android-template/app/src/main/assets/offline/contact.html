<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; line-height: 1.6; }
    h1 { font-size: 22px; color: #34d399; margin-bottom: 14px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 18px; margin-bottom: 14px; }
    .label { font-size: 12px; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.05em; }
    .value { font-size: 15px; font-weight: 600; color: #f8fafc; margin-top: 2px; margin-bottom: 12px; }
    a.action { display: inline-block; padding: 10px 16px; border-radius: 10px; background: #10b981; color: #0f172a; font-weight: 700; text-decoration: none; font-size: 14px; margin-right: 8px; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>Contact Us</h1>
  <div class="card">
    <div class="label">Email</div>
    <div class="value">support@example.com</div>
    <div class="label">Phone</div>
    <div class="value">+1 (555) 019-2834</div>
    <a class="action" href="mailto:support@example.com">Email Us</a>
    <a class="action" href="tel:+15550192834">Call Now</a>
  </div>
</body>
</html>
