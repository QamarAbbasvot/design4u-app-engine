<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; line-height: 1.6; }
    .hero { background: linear-gradient(135deg, #10b981, #059669); border-radius: 16px; padding: 24px; margin-bottom: 18px; color: #fff; }
    .hero h1 { font-size: 22px; margin-bottom: 6px; }
    .hero p { font-size: 14px; opacity: 0.92; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 18px; margin-bottom: 14px; }
    .card h2 { font-size: 16px; color: #34d399; margin-bottom: 6px; }
    .card p { font-size: 14px; color: #cbd5e1; }
    .btn { display: inline-block; margin-top: 12px; padding: 10px 18px; background: #10b981; color: #0f172a; font-weight: 700; border-radius: 10px; border: none; font-size: 14px; cursor: pointer; text-decoration: none; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Welcome to Our App</h1>
    <p>Fast, reliable hybrid access — available online and offline.</p>
  </div>
  <div class="card">
    <h2>Always Accessible</h2>
    <p>You are currently viewing our built-in offline home screen. Explore our info, services, and contact details anytime without internet.</p>
    <button class="btn" onclick="window.Design4U ? Design4U.retryOnline() : location.reload()">Reconnect Live Site</button>
  </div>
</body>
</html>
