name: Build Design4U Android App

on:
  repository_dispatch:
    types: [build_design4u_app]
  workflow_dispatch:
    inputs:
      app_name:
        description: "Application Display Name"
        required: true
        default: "Design4U App"
      package_id:
        description: "Android Package ID"
        required: true
        default: "com.design4u.app"
      version_name:
        description: "Version Name"
        required: false
        default: "1.0.0"
      version_code:
        description: "Version Code"
        required: false
        default: "1"
      website_url:
        description: "Live Website URL"
        required: true
        default: "https://example.com"
      primary_color:
        description: "Primary Hex Color"
        required: false
        default: "#10B981"

permissions:
  contents: write

jobs:
  build:
    name: Compile Release APK & Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set up Python & Pillow
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow for Icon & Splash Processing
        run: python -m pip install --quiet pillow

      - name: Inject Design4U App Configuration
        id: inject
        run: python .github/scripts/inject_config.py

      - name: Generate 2048-bit RSA Release Keystore (JKS)
        id: keystore
        env:
          APP_NAME: ${{ steps.inject.outputs.app_name }}
          PACKAGE_ID: ${{ steps.inject.outputs.package_id }}
          VERSION_NAME: ${{ steps.inject.outputs.version_name }}
          VERSION_CODE: ${{ steps.inject.outputs.version_code }}
          BUILD_ID: ${{ steps.inject.outputs.build_id }}
          STORE_PASS: "Design4U2026"
          KEY_PASS: "Design4U2026"
          KEY_ALIAS: "design4ukey"
        run: |
          rm -f android-template/app/release-keystore.jks

          keytool -genkeypair -v \
            -storetype JKS \
            -keystore android-template/app/release-keystore.jks \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Design4U, OU=Mobile, O=Design4U, L=WahCantt, S=Punjab, C=PK"

          printf 'storeFile=release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > android-template/keystore.properties

          FINGERPRINTS=$(keytool -list -v -storetype JKS -keystore android-template/app/release-keystore.jks -alias "$KEY_ALIAS" -storepass "$STORE_PASS" | grep -E "SHA1:|SHA256:" || true)

          export FINGERPRINTS
          python -c '
          import datetime, os
          e = os.environ
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          lines = [
              "============================================================",
              "Design4U Play Store Release Keystore Credentials",
              "============================================================",
              "App Name       : " + e.get("APP_NAME", ""),
              "Package ID     : " + e.get("PACKAGE_ID", ""),
              "Version        : " + e.get("VERSION_NAME", "") + " (Code " + e.get("VERSION_CODE", "") + ")",
              "Build ID       : " + e.get("BUILD_ID", ""),
              "Generated At   : " + now,
              "",
              "Keystore Type  : JKS",
              "Keystore File  : release-keystore.jks",
              "Key Alias      : " + e.get("KEY_ALIAS", ""),
              "Store Password : " + e.get("STORE_PASS", ""),
              "Key Password   : " + e.get("KEY_PASS", ""),
              "",
              "Certificates:",
              e.get("FINGERPRINTS", ""),
              "",
              "IMPORTANT: Keep release-keystore.jks and this file safe!",
              "Google Play requires the exact same signing key for all",
              "future updates to this applicationId.",
              "============================================================",
          ]
          open("keystore-info.txt", "w", encoding="utf-8").write("\n".join(lines) + "\n")
          '

      - name: Compile Signed Release APK & AAB
        working-directory: android-template
        run: |
          gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Collect Release Artifacts
        run: |
          mkdir -p dist
          cp android-template/app/build/outputs/apk/release/app-release.apk dist/app-release.apk
          cp android-template/app/build/outputs/bundle/release/app-release.aab dist/app-release.aab
          cp android-template/app/release-keystore.jks dist/release-keystore.jks
          cp keystore-info.txt dist/keystore-info.txt
          ls -lh dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}-${{ steps.inject.outputs.build_id }}"
          name: "${{ steps.inject.outputs.app_name }} v${{ steps.inject.outputs.version_name }} (Build #${{ github.run_number }})"
          body: |
            Automated Design4U Cloud Build complete.

            - **App Name:** `${{ steps.inject.outputs.app_name }}`
            - **Package ID:** `${{ steps.inject.outputs.package_id }}`
            - **Version:** `${{ steps.inject.outputs.version_name }}` (Code `${{ steps.inject.outputs.version_code }}`)
            - **Build ID:** `${{ steps.inject.outputs.build_id }}`
            - **Workflow Run:** #${{ github.run_number }}

            ### Downloads
            - `app-release.apk` — Direct installable Android APK
            - `app-release.aab` — Google Play Store Android App Bundle
            - `release-keystore.jks` — 2048-bit RSA signing keystore
            - `keystore-info.txt` — Keystore credentials & SHA fingerprints
          files: |
            dist/app-release.apk
            dist/app-release.aab
            dist/release-keystore.jks
            dist/keystore-info.txt
